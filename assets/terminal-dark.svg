<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="1200" height="344" role="img" aria-labelledby="termTitle">
  <title id="termTitle">An animated terminal session. whoami: alexis, frontend depth, full-stack reach, AI in the loop. ls shipped: automatist, easy-web-navigation, re-phraser, prompt-save-reuse, psalms-way. now: building Automatist, mobile-first AI automation that works offline.</title>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; fill: #E8EDF3; }
    .p { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; font-weight: 600; fill: #F0906A; }
    .o { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; fill: #9AA6B4; }
    .d { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; fill: #C9D2DC; }
    .h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #8B95A4; }
    .l { opacity: 0; }
    @keyframes ap { to { opacity: 1; } }
    .a1 { animation: ap 0.01s linear 0.20s forwards; }
    .a2 { animation: ap 0.30s linear 1.50s forwards; }
    .a3 { animation: ap 0.01s linear 2.20s forwards; }
    .a4 { animation: ap 0.30s linear 3.90s forwards; }
    .a5 { animation: ap 0.01s linear 4.70s forwards; }
    .a6 { animation: ap 0.30s linear 5.60s forwards; }
    .a7 { animation: ap 0.01s linear 6.30s forwards; }
    @keyframes w1 { to { transform: translateX(91.2px); } }
    @keyframes w2 { to { transform: translateX(159.6px); } }
    @keyframes w3 { to { transform: translateX(57px); } }
    .c1 { animation: w1 0.93s steps(8, end) 0.45s forwards; }
    .c2 { animation: w2 1.28s steps(14, end) 2.45s forwards; }
    .c3 { animation: w3 0.58s steps(5, end) 4.95s forwards; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cur { animation: blink 1.06s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
      .c1, .c2, .c3 { animation: none; transform: translateX(200px); }
      .cur { animation: none; }
    }
  </style>

  <clipPath id="win"><rect x="0.5" y="0.5" width="1199" height="343" rx="12"/></clipPath>

  <g clip-path="url(#win)">
    <rect width="1200" height="344" fill="#11161D"/>
    <rect width="1200" height="44" fill="#1A212B"/>
    <rect y="44" width="1200" height="1" fill="#2A323C"/>
    <circle cx="28" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="50" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="72" cy="22" r="6" fill="#28C840"/>
    <text x="600" y="27" text-anchor="middle" class="h">alexis@github:~</text>

    <g class="l a1">
      <text x="40" y="96" class="p">$</text>
      <text x="66" y="96" textLength="68.4" lengthAdjust="spacingAndGlyphs" class="t">whoami</text>
      <rect class="c1" x="66" y="75" width="90" height="28" fill="#11161D"/>
    </g>
    <g class="l a2">
      <text x="66" y="130" class="o">alexis · frontend depth, full-stack reach, AI in the loop</text>
    </g>
    <g class="l a3">
      <text x="40" y="164" class="p">$</text>
      <text x="66" y="164" textLength="136.8" lengthAdjust="spacingAndGlyphs" class="t">ls ~/shipped</text>
      <rect class="c2" x="66" y="143" width="160" height="28" fill="#11161D"/>
    </g>
    <g class="l a4">
      <text x="66" y="198" class="d">automatist/&#160;&#160;easy-web-navigation/&#160;&#160;re-phraser/&#160;&#160;prompt-save-reuse/&#160;&#160;psalms-way/</text>
    </g>
    <g class="l a5">
      <text x="40" y="232" class="p">$</text>
      <text x="66" y="232" textLength="34.2" lengthAdjust="spacingAndGlyphs" class="t">now</text>
      <rect class="c3" x="66" y="211" width="60" height="28" fill="#11161D"/>
    </g>
    <g class="l a6">
      <text x="66" y="266" class="o"><tspan fill="#F0906A">▸</tspan> building Automatist: mobile-first AI automation that works offline</text>
    </g>
    <g class="l a7">
      <text x="40" y="300" class="p">$</text>
      <rect class="cur" x="66" y="281" width="10" height="24" fill="#F0906A"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="343" rx="12" fill="none" stroke="#2A323C"/>
</svg>
