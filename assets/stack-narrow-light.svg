<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-labelledby="stackNarrowTitle">
  <title id="stackNarrowTitle">How an AI feature gets assembled: interface, orchestration, inference, data — with inference offering cloud, on-device, or offline models and data staying on the device.</title>

  <rect x="10" y="16" width="2" height="488" fill="#B0451B" opacity="0.35"/>

  <rect x="44" y="256" width="464" height="116" fill="#B0451B" opacity="0.05"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.2" fill="#B0451B">
    <text x="26" y="46">01</text>
    <text x="26" y="166">02</text>
    <text x="26" y="286">03</text>
    <text x="26" y="426">04</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#0B0D11">
    <text x="60" y="50">Interface</text>
    <text x="60" y="170">Orchestration</text>
    <text x="60" y="290">Inference</text>
    <text x="60" y="430">Data</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.6" fill="#5A6472">
    <text x="60" y="82">React · Angular · Compose</text>
    <text x="60" y="106">Chrome MV3</text>

    <text x="60" y="202">scheduling · retries</text>
    <text x="60" y="226">run diagnostics · approval gates</text>

    <text x="60" y="322">cloud provider API</text>
    <text x="60" y="346">on-device via MediaPipe</text>
    <text x="60" y="370">compatible offline models</text>

    <text x="60" y="462">stays on the device unless</text>
    <text x="60" y="486">you say otherwise</text>
  </g>

  <g fill="#E3E7EC">
    <rect x="60" y="130" width="448" height="1"/>
    <rect x="60" y="250" width="448" height="1"/>
    <rect x="60" y="394" width="448" height="1"/>
  </g>
</svg>
