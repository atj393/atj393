<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Alexis Johnson. Interfaces that feel obvious. Systems that hold up. AI that asks first.</title>

  <!-- transparent canvas, so the banner sits on any GitHub dark theme -->

  <!-- faint six-column layout grid -->
  <g fill="#F0906A" opacity="0.08">
    <rect x="860" y="96" width="32" height="190"/>
    <rect x="912" y="96" width="32" height="190"/>
    <rect x="964" y="96" width="32" height="190"/>
    <rect x="1016" y="96" width="32" height="190"/>
    <rect x="1068" y="96" width="32" height="190"/>
    <rect x="1120" y="96" width="32" height="190"/>
  </g>

  <text x="76" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3.4" fill="#8B95A4">FRONTEND DEPTH · FULL-STACK REACH · APPLIED AI</text>

  <rect x="48" y="96" width="3" height="190" fill="#F0906A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="600" letter-spacing="-1.1" fill="#E8EDF3">
    <text x="76" y="148">Interfaces that feel obvious.</text>
    <text x="76" y="204">Systems that hold up.</text>
    <text x="76" y="260">AI that asks first.</text>
  </g>

  <rect x="76" y="300" width="1076" height="1" fill="#1F2630"/>

  <text x="76" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#8B95A4">Ten years of shipping, from the pixel to the queue, with AI in the loop.</text>
</svg>
