<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" width="640" height="322" role="img" aria-labelledby="termNarrowTitle">
  <title id="termNarrowTitle">An animated terminal session. whoami: alexis, senior frontend and software engineer, eleven years, Berlin. ls shipped: automatist, easy-web-navigation, re-phraser, prompt-save-reuse, psalms-way. now: building Automatist, mobile-first AI automation that works offline.</title>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #E8EDF3; }
    .p { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; fill: #F0906A; }
    .o { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #9AA6B4; }
    .d { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #C9D2DC; }
    .h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #8B95A4; }
    .l { opacity: 0; }
    @keyframes ap { to { opacity: 1; } }
    .a1 { animation: ap 0.01s linear 0.20s forwards; }
    .a2 { animation: ap 0.30s linear 1.50s forwards; }
    .a3 { animation: ap 0.01s linear 2.20s forwards; }
    .a4 { animation: ap 0.30s linear 3.90s forwards; }
    .a4b { animation: ap 0.30s linear 4.10s forwards; }
    .a5 { animation: ap 0.01s linear 4.80s forwards; }
    .a6 { animation: ap 0.30s linear 5.70s forwards; }
    .a7 { animation: ap 0.01s linear 6.40s forwards; }
    @keyframes w1 { to { transform: translateX(81.6px); } }
    @keyframes w2 { to { transform: translateX(142.8px); } }
    @keyframes w3 { to { transform: translateX(51px); } }
    .c1 { animation: w1 0.93s steps(8, end) 0.45s forwards; }
    .c2 { animation: w2 1.28s steps(14, end) 2.45s forwards; }
    .c3 { animation: w3 0.58s steps(5, end) 5.05s forwards; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cur { animation: blink 1.06s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
      .c1, .c2, .c3 { animation: none; transform: translateX(180px); }
      .cur { animation: none; }
    }
  </style>

  <clipPath id="winN"><rect x="0.5" y="0.5" width="639" height="321" rx="10"/></clipPath>

  <g clip-path="url(#winN)">
    <rect width="640" height="322" fill="#11161D"/>
    <rect width="640" height="38" fill="#1A212B"/>
    <rect y="38" width="640" height="1" fill="#2A323C"/>
    <circle cx="24" cy="19" r="5" fill="#FF5F57"/>
    <circle cx="43" cy="19" r="5" fill="#FEBC2E"/>
    <circle cx="62" cy="19" r="5" fill="#28C840"/>
    <text x="320" y="24" text-anchor="middle" class="h">alexis@github:~</text>

    <g class="l a1">
      <text x="24" y="78" class="p">$</text>
      <text x="46" y="78" textLength="61.2" lengthAdjust="spacingAndGlyphs" class="t">whoami</text>
      <rect class="c1" x="46" y="59" width="80" height="26" fill="#11161D"/>
    </g>
    <g class="l a2">
      <text x="46" y="108" class="o">alexis · senior frontend engineer</text>
    </g>
    <g class="l a3">
      <text x="24" y="138" class="p">$</text>
      <text x="46" y="138" textLength="122.4" lengthAdjust="spacingAndGlyphs" class="t">ls ~/shipped</text>
      <rect class="c2" x="46" y="119" width="140" height="26" fill="#11161D"/>
    </g>
    <g class="l a4">
      <text x="46" y="168" class="d">automatist/&#160;&#160;easy-web-nav/&#160;&#160;re-phraser/</text>
    </g>
    <g class="l a4b">
      <text x="46" y="198" class="d">prompt-save/&#160;&#160;psalms-way/</text>
    </g>
    <g class="l a5">
      <text x="24" y="228" class="p">$</text>
      <text x="46" y="228" textLength="30.6" lengthAdjust="spacingAndGlyphs" class="t">now</text>
      <rect class="c3" x="46" y="209" width="55" height="26" fill="#11161D"/>
    </g>
    <g class="l a6">
      <text x="46" y="258" class="o"><tspan fill="#F0906A">▸</tspan> building Automatist: on-device AI</text>
    </g>
    <g class="l a7">
      <text x="24" y="288" class="p">$</text>
      <rect class="cur" x="46" y="271" width="9" height="21" fill="#F0906A"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="639" height="321" rx="10" fill="none" stroke="#D0D7DE"/>
</svg>
