<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-labelledby="stackTitle">
  <title id="stackTitle">Four layers I build across: Interface (React, Angular, Compose, Chrome MV3); Orchestration (scheduling, retries, diagnostics, approvals); Inference (cloud provider API, on-device via MediaPipe, compatible offline); Data (stays on the device unless you say otherwise).</title>

  <!-- inference column, highlighted: the layer the others are built around -->
  <rect x="500" y="8" width="250" height="164" fill="#B0451B" opacity="0.05"/>

  <g fill="#B0451B">
    <rect x="24" y="16" width="24" height="2"/>
    <rect x="274" y="16" width="24" height="2"/>
    <rect x="524" y="16" width="24" height="2"/>
    <rect x="774" y="16" width="24" height="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#B0451B">
    <text x="24" y="48">01</text>
    <text x="274" y="48">02</text>
    <text x="524" y="48">03</text>
    <text x="774" y="48">04</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0B0D11">
    <text x="24" y="80">Interface</text>
    <text x="274" y="80">Orchestration</text>
    <text x="524" y="80">Inference</text>
    <text x="774" y="80">Data</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6" fill="#5A6472">
    <text x="24" y="110">React · Angular</text>
    <text x="24" y="130">Compose · Chrome MV3</text>

    <text x="274" y="110">scheduling · retries</text>
    <text x="274" y="130">diagnostics · approvals</text>

    <text x="524" y="110">cloud provider API</text>
    <text x="524" y="130">on-device via MediaPipe</text>
    <text x="524" y="150">compatible offline</text>

    <text x="774" y="110">stays on the device</text>
    <text x="774" y="130">unless you say otherwise</text>
  </g>

  <g fill="#E3E7EC">
    <rect x="250" y="16" width="1" height="150"/>
    <rect x="500" y="16" width="1" height="150"/>
    <rect x="750" y="16" width="1" height="150"/>
  </g>
</svg>
